.cardio-block{background:linear-gradient(135deg,rgba(200,169,110,0.1),rgba(200,169,110,0.04));border:1px solid rgba(200,169,110,0.25);border-radius:12px;padding:14px 16px;}

const days=["mon","tue","wed","thu","fri","sat","sun"];
const dayFull={mon:"Monday",tue:"Tuesday",wed:"Wednesday",thu:"Thursday",fri:"Friday",sat:"Saturday",sun:"Sunday"};
const dotLabel={mon:"MON",tue:"TUE",wed:"WED",thu:"THU",fri:"FRI",sat:"SAT",sun:"SUN"};
const tagMeta={run:{cls:"t-run",label:"Run"},bike:{cls:"t-bike",label:"Bike"},lift:{cls:"t-lift",label:"Lift"},hip:{cls:"t-hip",label:"Hip"},core:{cls:"t-core",label:"Core"}};

let currentWeek=1;
let currentDayKey=null;

function getLogs(){try{return JSON.parse(localStorage.getItem("marioLogs")||"{}");}catch{return {};}}
function saveLogs(l){localStorage.setItem("marioLogs",JSON.stringify(l));}
function logKey(w,d){return "w"+w+"_"+d;}

function getPhase(w){return phases.find(p=>p.weeks.includes(w));}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2200);
}

function renderAll(){
  const wscroll=document.getElementById("weekScroll");
  wscroll.innerHTML="";
  for(let w=1;w<=6;w++){
    const b=document.createElement("button");
    b.className="week-btn"+(w===currentWeek?" active":"");
    b.textContent="Week "+w;
    b.onclick=()=>{currentWeek=w;renderAll();};
    wscroll.appendChild(b);
  }
  document.getElementById("phasePill").textContent=getPhase(currentWeek).label;
  const list=document.getElementById("daysList");
  list.innerHTML="";
  const wk=buildWeek(currentWeek);
  const logs=getLogs();
  // Calendar: figure out today's day-of-week and which days are past
  const now=new Date();
  const todayDow=now.getDay(); // 0=Sun,1=Mon,...,6=Sat
  const dowMap={mon:1,tue:2,wed:3,thu:4,fri:5,sat:6,sun:0};
  // Program start: Week 1 started on the Monday before or on today
  // We just use current week's day-of-week awareness: past = dow < todayDow (within same week)
  // Today = dow === todayDow
  days.forEach(d=>{
    const day=wk[d];
    const hasLog=!!logs[logKey(currentWeek,d)];
    const dow=dowMap[d];
    const isPast=dow<todayDow && !day.rest;
    const isToday=dow===todayDow && !day.rest;
    const card=document.createElement("div");
    let cls="day-card"+(day.rest?" rest":"")+(hasLog?" has-log":"")+(isPast?" past":"")+(isToday?" today":"");
    card.className=cls;
    const dotCls="dot-"+day.dot;
    const extraTags=hasLog?'<span class="tag t-logged">✓ Logged</span>':"";
    const tagsHtml=(day.tags||[]).filter(t=>t!=="rest").map(t=>`<span class="tag ${tagMeta[t]?.cls||""}">${tagMeta[t]?.label||t}</span>`).join("");
    const todayBadge=isToday?'<span class="today-badge">TODAY</span>':"";
    const rightEl=day.rest?"":isPast?'<span class="past-check">✓</span>':`<div class="day-arrow">›</div>`;
    card.innerHTML=`<div class="day-dot ${dotCls}">${dotLabel[d]}</div><div class="day-info"><div class="day-name">${dayFull[d]}${todayBadge}</div><div class="day-title">${day.title}</div>${tagsHtml||extraTags?`<div class="day-tags">${tagsHtml}${extraTags}</div>`:""}</div>${rightEl}`;
    if(!day.rest) card.onclick=()=>openDetail(d,day);
    list.appendChild(card);
  });
}

function buildSectionsHTML(sections){
  let html="";
  (sections||[]).forEach(sec=>{
    html+=`<div class="section"><div class="section-label">${sec.label}</div>`;
    if(sec.hip){
      html+=`<div class="hip-block"><div class="hip-header">Hip abductor circuit — every session</div>`;
      sec.items.forEach(i=>{html+=`<div class="exercise-item"><span class="ex-name">${i.name}</span><span class="ex-detail">${i.detail}</span></div>`;});
      html+=`</div>`;
    } else if(sec.superset){
      html+=`<div class="superset-wrap"><div class="superset-header">Superset — no rest between</div>`;
      sec.items.forEach(i=>{html+=`<div class="exercise-item"><span class="ex-name">${i.name}</span><span class="ex-detail">${i.detail}</span></div>`;});
      html+=`</div>`;
    } else {
      sec.items.forEach(i=>{html+=`<div class="exercise-item"><span class="ex-name">${i.name}</span><span class="ex-detail">${i.detail}</span></div>`;});
    }
    html+=`</div>`;
  });
  return html;
}

        <div class="log-field"><label>Run distance / pace</label><input type="text" id="log_run" placeholder="e.g. 2.5 mi @ 10:30" value="${existing.run||""}"></div>
      </div>
      <div class="log-field"><label>Bike (intervals / time)</label><input type="text" id="log_bike" placeholder="e.g. 6×45s completed, felt strong" value="${existing.bike||""}"></div>
      <div class="log-field"><label>Hip / shoulder notes</label><input type="text" id="log_injury" placeholder="e.g. hip felt tight, shoulder fine" value="${existing.injury||""}"></div>
      <div class="log-field"><label>Overall notes</label><textarea id="log_notes" placeholder="How'd it go? What felt good or sucked?">${existing.notes||""}</textarea></div>
      <button class="save-log-btn" onclick="saveLog('${dayKey}')">Save Session Log</button>
    </div>
  </div>`;
}

function buildExportHTML(){
  const logs=getLogs();
  const keys=Object.keys(logs);
  if(keys.length===0) return "";
  const summary=keys.map(k=>{
    const l=logs[k];
    const parts=[`[${k}]`];
    if(l.energy) parts.push("Energy: "+l.energy);
    if(l.sleep) parts.push("Sleep: "+l.sleep);
    if(l.bench) parts.push("Bench: "+l.bench);
    if(l.squat) parts.push("Squat: "+l.squat);
    if(l.dead) parts.push("Deadlift: "+l.dead);
    if(l.run) parts.push("Run: "+l.run);
    if(l.bike) parts.push("Bike: "+l.bike);
    if(l.injury) parts.push("Hip/shoulder: "+l.injury);
    if(l.notes) parts.push("Notes: "+l.notes);
    return parts.join(" | ");
  }).join("\n");
  return `
  <div class="export-section">
    <div class="export-label">📋 Copy & paste this to Claude for feedback</div>
    <div class="export-text" id="exportText">${summary}</div>
    <button class="export-btn" onclick="copyExport()">Copy to Clipboard</button>
  </div>`;
}

function saveLog(dayKey){
  const logs=getLogs();
  const key=logKey(currentWeek,dayKey);
  logs[key]={
    energy:document.getElementById("log_energy")?.value||"",
    sleep:document.getElementById("log_sleep")?.value||"",
    bench:document.getElementById("log_bench")?.value||"",
    squat:document.getElementById("log_squat")?.value||"",
    dead:document.getElementById("log_dead")?.value||"",
    run:document.getElementById("log_run")?.value||"",
    bike:document.getElementById("log_bike")?.value||"",
    injury:document.getElementById("log_injury")?.value||"",
    notes:document.getElementById("log_notes")?.value||""
  };
  saveLogs(logs);
  showToast("Session logged ✓");
  renderAll();
  // refresh export section if visible
  const exp=document.getElementById("exportSection");
  if(exp) exp.innerHTML=buildExportHTML();
}

function copyExport(){
  const txt=document.getElementById("exportText")?.innerText||"";
  navigator.clipboard.writeText(txt).then(()=>showToast("Copied! Paste into Claude ✓")).catch(()=>{
    const ta=document.createElement("textarea");
    ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);
    showToast("Copied! Paste into Claude ✓");
  });
}

function openDetail(dayKey,day){
  currentDayKey=dayKey;
  document.getElementById("detailDayName").textContent=dayFull[dayKey];
  document.getElementById("detailDayTitle").textContent=day.title;
  let html="";
  if(day.cardio) html+=`<div class="cardio-block"><div class="cardio-type">${day.cardio.type}</div><div class="cardio-detail">${day.cardio.detail}</div></div>`;
  html+=buildSectionsHTML(day.sections);
  if(day.note) html+=`<div class="note-block">${day.note}</div>`;
  html+=buildLogHTML(dayKey);
  html+=`<div id="exportSection">${buildExportHTML()}</div>`;
  document.getElementById("detailBody").innerHTML=html;
  const overlay=document.getElementById("detailOverlay");
  overlay.classList.add("open");
  overlay.scrollTop=0;
}

function closeDetail(){
  document.getElementById("detailOverlay").classList.remove("open");
  renderAll();
}

let lastRandIdx=-1;
function openRandom(){
  let idx;
  do { idx=Math.floor(Math.random()*RANDOM_POOL.length); } while(idx===lastRandIdx && RANDOM_POOL.length>1);
  lastRandIdx=idx;
  renderRandom(idx);
  document.getElementById("randOverlay").classList.add("open");
  document.getElementById("randOverlay").scrollTop=0;
}

function renderRandom(idx){
  const w=RANDOM_POOL[idx];
  let html=`<div style="text-align:center;padding:4px 0 16px"><div class="rand-label">Today's wildcard</div><div class="rand-title">${w.title}</div><button class="reroll-btn" onclick="reroll()">🎲 Roll Again</button></div>`;
  if(w.cardio) html+=`<div class="cardio-block"><div class="cardio-type">${w.cardio.type}</div><div class="cardio-detail">${w.cardio.detail}</div></div>`;
  html+=buildSectionsHTML(w.sections);
  document.getElementById("randBody").innerHTML=html;
}

function reroll(){
  let idx;
  do { idx=Math.floor(Math.random()*RANDOM_POOL.length); } while(idx===lastRandIdx && RANDOM_POOL.length>1);
  lastRandIdx=idx;
  renderRandom(idx);
}

function closeRandom(){
  document.getElementById("randOverlay").classList.remove("open");
}

renderAll();
</script>
</body>
</html>
